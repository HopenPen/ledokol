stages: [test, deploy]

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

backend_tests:
  stage: test
  image: ghcr.io/astral-sh/uv:0.13.5-python3.12-trixie-slim
  variables:
    UV_LINK_MODE: copy
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    CASHFLOW_ENV: test
    CASHFLOW_DATABASE_URL: sqlite:///./test_cashflow.db
  cache:
    key:
      files: [backend/uv.lock]
    paths: [.cache/uv]
  script:
    - cd backend
    - uv sync --locked
    - uv run --no-sync pytest

frontend_build:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build

deploy_production:
  stage: deploy
  image: alpine:3.22
  resource_group: production
  interruptible: false
  environment:
    name: production
    url: https://194.113.106.232
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - install -m 600 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - install -m 600 "$SSH_PRIVATE_KEY" /tmp/deploy-key
  script:
    - git archive --format=tar.gz --output=/tmp/release.tar.gz "$CI_COMMIT_SHA" backend frontend mocks deploy
    - ssh -T -i /tmp/deploy-key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $CI_COMMIT_SHA" < /tmp/release.tar.gz
