[project]
name = "cashflow"
version = "0.1.0"
description = "Прогноз остатка и кассовых разрывов для МСП по банковской выписке"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11,<0.12",
    "email-validator>=2.2,<3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
mcp = ["mcp>=1.2"]
ml = ["catboost>=1.2"]

# Окружение — через uv: `uv sync` (dev-группа ставится по умолчанию), `uv sync --extra llm --extra ml`.
[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5"]

[project.scripts]
cashflow = "app.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
