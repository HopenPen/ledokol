# Docker DNS: обновляем адрес API после пересоздания контейнера.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream cashflow_api {
  zone cashflow_api 64k;
  server api:8000 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location /api/ { proxy_pass http://cashflow_api; client_max_body_size 50m; }
  location /meta/ { proxy_pass http://cashflow_api; }
  location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
  location / { try_files $uri /index.html; }   # SPA: все пути отдаём index.html
}
