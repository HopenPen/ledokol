server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location /api/ { proxy_pass http://api:8000; client_max_body_size 50m; }
  location /meta/ { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }   # SPA: все пути отдаём index.html
}
